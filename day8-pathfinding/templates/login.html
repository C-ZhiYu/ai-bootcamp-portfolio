<!DOCTYPE html>
<html>

<head>

    <title>Editor Login</title>

</head>

<body>

<h1>Editor Login</h1>

<form method="POST">

    <label>Password</label>

    <input
        type="password"
        name="password"
    >

    <button type="submit">
        Login
    </button>

</form>

{% if error %}

<p style="color:red">
{{ error }}
</p>

{% endif %}

</body>

</html>
